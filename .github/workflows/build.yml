name: OpenWrt Script Build

on:
  workflow_dispatch:
  repository_dispatch:
  # 每日自主重建一次（UTC 18:00 = 北京时间 02:00），与 OpenWRT 的
  # AutoCheck（UTC 21:17）及验证任务错开；缓存命中时不会显著增加开销。
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive
  WORKDIR: ${{ github.workspace }}/openwrt
  CONFIG_URL: ${{ github.workspace }}/.config
  RELEASE_DIR: ${{ github.workspace }}/release-assets
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  FORCE_UNSAFE_CONFIGURE: 1
  SINGLE_JOB_RETRY: 0

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Init environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            clang llvm lld unzip ccache \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make \
            python3 rsync file patch bison flex zlib1g-dev libssl-dev \
            libelf-dev bc cpio gettext swig time
          sudo timedatectl set-timezone Asia/Shanghai
          sudo apt-get -qq autoremove --purge -y
          sudo apt-get -qq clean

      - name: Clone source
        run: |
          set -euo pipefail
          git clone -b main https://github.com/openwrt/openwrt "$WORKDIR"
          # 可复现构建：以源码 HEAD 的提交时间作为 SOURCE_DATE_EPOCH
          EPOCH=$(git -C "$WORKDIR" log -1 --format=%ct)
          case "$EPOCH" in
            ''|*[!0-9]*) echo "::error::无法获取有效的 SOURCE_DATE_EPOCH"; exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$EPOCH"

      - name: Compute toolchain hash
        id: toolchain-hash
        run: |
          HASH=$(git -C "$WORKDIR" log --pretty=tformat:%h -n1 -- tools toolchain)
          echo "hash=${HASH:-none}" >> "$GITHUB_OUTPUT"

      - name: Cache dl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-x86-${{ hashFiles('.config', 'compile.sh') }}
          restore-keys: |
            dl-${{ runner.os }}-x86-

      - name: Restore toolchain cache
        id: toolchain-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/staging_dir
          key: toolchain-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}
          restore-keys: |
            toolchain-${{ runner.os }}-x86-

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/.ccache
          key: ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-
            ccache-${{ runner.os }}-x86-

      # 解析 honk 工具链版本（commit → pins.env / release.yml → zig 版本），
      # 供 setup-zig 使用；脚本仓库内无 honk Makefile 时用内置 fallback commit，
      # 与 compile.sh 内部解析同源，确保版本一致。
      - name: Resolve honk toolchain pins
        id: honk-pins
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/honk_toolchain.sh" > "$RUNNER_TEMP/honk-pins.env"
          while IFS='=' read -r key value; do
            case "$key" in
              ZIG_VERSION|BPF_LINKER_VERSION|HONK_SRC_VERSION) ;;
              *) continue ;;
            esac
            [[ "$value" =~ ^[A-Za-z0-9._:/-]+$ ]] || { echo "::error::非法 $key=$value"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < "$RUNNER_TEMP/honk-pins.env"
          echo "zig 版本：$(grep '^ZIG_VERSION=' "$RUNNER_TEMP/honk-pins.env" | cut -d= -f2)"

      - name: Setup Zig for honk
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.honk-pins.outputs.ZIG_VERSION }}

      - name: Run compile.sh
        env:
          TOOLCHAIN_KEY: toolchain-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}
        run: |
          chmod +x compile.sh
          ./compile.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-x86-64
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload build logs on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: openwrt-build-logs
          path: |
            openwrt/build.log
            openwrt/retry-*.log
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save toolchain cache
        if: always() && steps.toolchain-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/staging_dir
          key: ${{ steps.toolchain-restore.outputs.cache-primary-key }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: firmware-x86-64
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="OpenWrt-$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")-${GITHUB_RUN_ID: -6}"
          echo "Release tag: $TAG"

          if [ ! -f release-assets/release-notes.txt ]; then
            echo "::error::缺少 release-assets/release-notes.txt"
            exit 1
          fi

          shopt -s nullglob
          files=(release-assets/*.img.gz release-assets/*.img release-assets/*.bin \
                 release-assets/*.manifest release-assets/*.buildinfo)
          shopt -u nullglob

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::release-assets/ 下没有找到任何固件文件"
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --title "$TAG" \
            --notes-file release-assets/release-notes.txt \
            "${files[@]}"

          echo "Release 创建完成：https://github.com/$GH_REPO/releases/tag/$TAG"

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEEP_RELEASES=7

          LIST="$(gh release list \
            --repo "$GH_REPO" \
            --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("backup-") | not)) | .[].tagName')"

          TAGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && TAGS+=("$line")
          done <<< "$LIST"

          echo "当前 Release 数量：${#TAGS[@]}（保留最新 $KEEP_RELEASES 个）"
          if [ "${#TAGS[@]}" -le "$KEEP_RELEASES" ]; then
            exit 0
          fi

          for tag in "${TAGS[@]:$KEEP_RELEASES}"; do
            gh release delete "$tag" --repo "$GH_REPO" -y --cleanup-tag || true
          done
